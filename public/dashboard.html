<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAE – Dashboard V2</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand">AAE · ANALYSE</div><h1>Tableau de bord</h1><p>Lecture des retours et bilan automatique</p></header><main class="wrap"><div class="card"><div class="grid"><div class="field"><label>Token administrateur</label><input id="token" type="password"></div><div class="field"><label>ID compétition</label><input id="cid" placeholder="FOOT-2026-xxxxx"></div></div><div class="actions"><button class="btn" onclick="loadComp()">Analyser la compétition</button><button class="btn secondary" onclick="loadNational()">Vue nationale</button><button class="btn secondary" onclick="exportCsv()">Exporter CSV</button></div></div><div id="out"></div></main><script src="app.js"></script><script>
function auth(){return {'x-admin-token':token.value}}function cardMetric(a,b){return `<div class="metric"><span class="muted">${a}</span><b>${b}</b></div>`}async function loadComp(){try{const s=await api('/api/admin/results?id='+encodeURIComponent(cid.value),{headers:auth()});renderComp(s)}catch(e){const d=demoGet(cid.value);if(!d){out.innerHTML='<div class="notice">Compétition introuvable.</div>';return}renderDemo(d)}}function renderComp(s){let domains=Object.entries(s.domainAvg).filter(([k])=>k!=='recommandation');out.innerHTML=`<div class="cards">${cardMetric('Réponses',s.responseCount)}${cardMetric('Score moyen',s.overall10+'/10')}${cardMetric('Recommandation',s.recommendationRate+'%')}${cardMetric('Discipline',esc(s.competition.discipline))}</div><div class="card"><h2>Bilan automatique</h2><p><b>Points forts</b></p><ul class="list">${s.strengths.map(x=>`<li>${esc(x[0])} · ${x[1]}/5</li>`).join('')}</ul><p><b>Axes d'amélioration</b></p><ul class="list">${s.improvements.map(x=>`<li>${esc(x[0])} · ${x[1]}/5</li>`).join('')}</ul></div><div class="card"><h2>Indicateurs</h2>${domains.map(x=>`<p><b>${esc(x[0])}</b> · ${x[1]}/5</p><div class="bar"><span style="width:${x[1]*20}%"></span></div>`).join('')}</div>`}function renderDemo(d){const responses=d.responses||[];const qs=d.questions||[];const avg={};for(const q of qs.filter(q=>q.type==='rating')){const vals=responses.map(r=>Number(r[q.id])).filter(Boolean);if(vals.length)avg[q.domain]=+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2)}const recQ=qs.find(q=>q.domain==='recommandation');const rec=recQ?Math.round(responses.filter(r=>r[recQ.id]==='oui').length*100/Math.max(1,responses.length)):0;renderComp({competition:d,responseCount:responses.length,overallAvg:Object.values(avg).length?+(Object.values(avg).reduce((a,b)=>a+b,0)/Object.values(avg).length).toFixed(2):0,recommendationRate:rec,domainAvg:avg,strengths:Object.entries(avg).sort((a,b)=>b[1]-a[1]).slice(0,3),improvements:Object.entries(avg).sort((a,b)=>a[1]-b[1]).slice(0,3)})}async function loadNational(){try{const r=await api('/api/admin/national',{headers:auth()});out.innerHTML='<div class="card"><h2>Vue nationale</h2><div class="tablewrap"><table class="table"><tr><th>Année</th><th>Discipline</th><th>Compétition</th><th>Réponses</th><th>Score</th><th>Recommandation</th></tr>'+r.competitions.map(x=>`<tr><td>${x.year}</td><td>${esc(x.discipline)}</td><td>${esc(x.name)}</td><td>${x.responseCount}</td><td>${x.overall10}/10</td><td>${x.recommendationRate}%</td></tr>`).join('')+'</table></div></div>'}catch(e){out.innerHTML='<div class="notice">La vue nationale nécessite l’API D1.</div>'}}async function exportCsv(){if(!cid.value)return alert('Indiquez un ID de compétition.');const r=await fetch(API_BASE+'/api/admin/export?id='+encodeURIComponent(cid.value),{headers:auth()});if(!r.ok)return alert('Export impossible : '+(await r.text()));const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=cid.value+'.csv';a.click();URL.revokeObjectURL(a.href)}
</script></body></html>

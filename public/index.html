<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAE – Retour compétition</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand">ARMÉE DE L’AIR ET DE L’ESPACE · RETOUR D’EXPÉRIENCE</div><h1 id="title">Votre avis compte</h1><p id="sub">Quelques minutes pour améliorer les prochaines compétitions.</p></header><main class="wrap"><div class="progress"><div id="prog"></div></div><div id="app"></div></main><script src="app.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get('competition')||'DEMO-2026';let data,answers={};
async function load(){try{data=await api('/api/competition?id='+encodeURIComponent(id));render(data)}catch(e){data=demoGet(id);if(!data){data={competition:{id,year:2026,discipline:'Démonstration',name:'Compétition de démonstration'},questions:[{id:1,label:'Organisation générale',type:'rating',domain:'organisation'},{id:2,label:'Accueil et prise en charge',type:'rating',domain:'accueil'},{id:3,label:'Informations avant et pendant la compétition',type:'rating',domain:'communication'},{id:4,label:'Formule sportive',type:'rating',domain:'formule'},{id:5,label:'Déroulement et respect des horaires',type:'rating',domain:'horaires'},{id:6,label:'Installations et équipements',type:'rating',domain:'installations'},{id:7,label:'Hébergement',type:'rating',domain:'hebergement'},{id:8,label:'Restauration',type:'rating',domain:'restauration'},{id:9,label:'Recommanderiez-vous cette compétition ?',type:'yesno',domain:'recommandation'},{id:10,label:'Votre principale piste d’amélioration',type:'text',domain:'amelioration'},{id:11,label:'Une remarque ou suggestion complémentaire ?',type:'text',domain:'commentaire'}]};}render(data)}}
function render(d){document.getElementById('title').textContent=d.competition.name;document.getElementById('sub').textContent=`${d.competition.discipline} · ${d.competition.year} · Votre avis est anonyme`;let html='';d.questions.forEach((q,i)=>{html+=`<section class="card q"><h3>${i+1}. ${esc(q.label)}</h3>`+(q.type==='rating'||q.type==='rating_na'?`<div class="rating">${[1,2,3,4,5].map(n=>`<button type="button" onclick="pick(${q.id},'${n}',this)">${n}</button>`).join('')}</div>${q.type==='rating_na'?`<button class="na" type="button" onclick="pick(${q.id},'non_utilise',this)">Non utilisé</button>`:''}<div class="muted">1 = très insatisfait · 5 = très satisfait</div>`:q.type==='overall'?`<div class="rating ten">${Array.from({length:11},(_,n)=>`<button type="button" onclick="pick(${q.id},'${n}',this)">${n}</button>`).join('')}</div>`:q.type==='yesno'?`<div class="yn"><button type="button" onclick="pick(${q.id},'oui',this)">Oui</button><button type="button" onclick="pick(${q.id},'non',this)">Non</button></div>`:`<textarea maxlength="1000" placeholder="Votre réponse…" oninput="answers[${q.id}]=this.value;updateProgress()"></textarea>`)+'</section>'});html+=`<div class="card"><button class="btn" onclick="submitForm()">Envoyer mon avis</button><p class="muted">Aucune donnée d’identité ou donnée opérationnelle n’est demandée.</p></div>`;document.getElementById('app').innerHTML=html;document.getElementById('prog').style.width='0%'}
function updateProgress(){let total=data.questions.length,done=Object.keys(answers).filter(k=>String(answers[k]).trim()!=='').length;document.getElementById('prog').style.width=Math.round(done/total*100)+'%'}
function pick(id,v,el){answers[id]=v;el.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));el.classList.add('active');updateProgress()}
async function submitForm(){const missing=data.questions.filter(q=>answers[q.id]===undefined || String(answers[q.id]).trim()==='');if(missing.length){alert('Merci de répondre à toutes les questions.');missing[0]&&scrollTo({top:document.querySelectorAll('.q')[data.questions.indexOf(missing[0])].offsetTop-10,behavior:'smooth'});return}try{await api('/api/response',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({competition_id:data.competition.id,answers:Object.entries(answers).map(([question_id,value])=>({question_id:Number(question_id),value}))})})}catch(e){const d=demoGet(data.competition.id)||{...data.competition,questions:data.questions,responses:[]};d.responses=d.responses||[];d.responses.push(answers);demoSave(d)}document.getElementById('app').innerHTML='<div class="card success"><h2>Merci pour votre participation !</h2><p>Votre retour sera intégré au bilan de la compétition.</p></div>';document.getElementById('prog').style.width='100%'}load();
</script></body></html>

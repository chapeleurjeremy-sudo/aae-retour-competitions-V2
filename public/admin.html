<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AAE – Administration V2</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><header class="top"><div class="brand">AAE · ADMINISTRATION</div><h1>Gestion des compétitions</h1><p>Création · QR code · accès aux résultats</p></header><main class="wrap"><div class="card"><h2>Accès administrateur</h2><div class="grid"><div class="field"><label>Token</label><input id="token" type="password" placeholder="ADMIN_TOKEN"></div><div class="field"><label>URL de l'application</label><input id="base" value="" placeholder="https://.../index.html"></div></div><p class="muted">Le token n'est pas stocké sur le serveur par cette page.</p></div><div class="card"><h2>Nouvelle compétition</h2><div class="grid"><div class="field"><label>Année</label><input id="year" type="number" value="2026"></div><div class="field"><label>Discipline</label><input id="discipline" placeholder="Football"></div><div class="field"><label>Nom de la compétition</label><input id="name" placeholder="Championnat national AAE"></div><div class="field"><label>Organisateur</label><input id="organizer" placeholder="Organisateur"></div></div><div class="field"><label>Questions spécifiques (maximum 3)</label><textarea id="custom" placeholder="Une question par ligne"></textarea></div><button class="btn" onclick="create()">Créer la compétition</button><div id="created"></div></div><div class="card"><h2>Tableau de bord</h2><div class="actions"><button class="btn secondary" onclick="location.href='dashboard.html'">Ouvrir le dashboard</button><button class="btn secondary" onclick="list()">Actualiser la liste</button></div><div id="list"></div></div></main><script src="app.js"></script><script>
let current;function headers(){return {'content-type':'application/json','x-admin-token':document.getElementById('token').value}}async function create(){const b={year:Number(year.value),discipline:discipline.value,name:name.value,organizer:organizer.value,customQuestions:custom.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,3)};try{const r=await api('/api/admin/competition',{method:'POST',headers:headers(),body:JSON.stringify(b)});showCreated(r.id,b)}catch(e){const c=demoCreate(b);showCreated(c.id,c)}}function showCreated(id,b){const base=(document.getElementById('base').value||location.href.replace('admin.html','index.html')).replace(/\/$/,'');const link=base+'?competition='+encodeURIComponent(id);document.getElementById('created').innerHTML=`<div class="notice success"><b>Compétition créée :</b> ${esc(id)}<br><br><a href="${esc(link)}" target="_blank">Ouvrir le questionnaire</a><div id="qr" style="margin-top:15px"></div><button class="btn secondary" onclick="navigator.clipboard.writeText('${link.replaceAll("'","\\'")}')">Copier le lien</button></div>`;new QRCode(document.getElementById('qr'),{text:link,width:220,height:220})}async function list(){try{const r=await api('/api/admin/competitions',{headers:{'x-admin-token':document.getElementById('token').value}});document.getElementById('list').innerHTML='<div class="tablewrap"><table class="table"><tr><th>Année</th><th>Discipline</th><th>Compétition</th><th>ID</th></tr>'+r.competitions.map(x=>`<tr><td>${x.year}</td><td>${esc(x.discipline)}</td><td>${esc(x.name)}</td><td>${esc(x.id)}</td></tr>`).join('')+'</table></div>'}catch(e){document.getElementById('list').innerHTML='<div class="notice">Mode démonstration : les données serveur ne sont pas accessibles.</div>'}}</script></body></html>
